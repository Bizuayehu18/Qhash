name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  portable:
    name: Portable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.9.0
      - name: Clean install
        run: npm ci --include=dev --no-audit --no-fund
      - name: Verify
        run: npm run verify
      - name: Confirm generated files remain clean
        run: git diff --exit-code -- package.json package-lock.json src/routeTree.gen.ts src/lib/database.generated.ts

  native-postgres:
    name: Native PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_DB: qhash_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qhash_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/qhash_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.9.0
      - name: Clean install
        run: npm ci --include=dev --no-audit --no-fund
      - name: Native database verification
        run: npm run verify:native
